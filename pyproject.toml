[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-client"
version = "0.5.0"
description = "A uniform workflow-driven LLM client for any OpenAI-compatible server"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/ak47-arch/llamacpp_inference_server"

[tool.setuptools.packages.find]
include = ["llm_client*"]

[tool.pytest.ini_options]
markers = [
    "integration: mark tests that require a running llm/ inference server",
]