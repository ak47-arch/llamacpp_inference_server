# Dedicated model registry for the shared LLM service.

providers:
  - id: gemma_e2b_local
    provider_type: openai_compatible
    model_name: gemma_e2b_local
    connection:
      base_url: http://127.0.0.1:18012
      managed_server:
        binary_path: /opt/llama-cpp/llama-server
        model_path: /models/google_gemma-4-E2B-it-Q4_K_M.gguf
        host: 127.0.0.1
        port: 18012
        startup_timeout_seconds: 180
        ctx_size: 8192
        threads: 8
        extra_args:
          - --reasoning
          - "off"
          - --reasoning-budget
          - "0"
          - --reasoning-format
          - none
    default_params:
      temperature: 0.0
      max_tokens: 512
      timeout_seconds: 300

  - id: gemma_e4b_local
    provider_type: openai_compatible
    model_name: gemma_e4b_local
    connection:
      base_url: http://127.0.0.1:18013
      managed_server:
        binary_path: /opt/llama-cpp/llama-server
        model_path: /models/gemma-4-E4B-it-UD-IQ2_M.gguf
        host: 127.0.0.1
        port: 18013
        startup_timeout_seconds: 180
        ctx_size: 8192
        threads: 8
        extra_args:
          - --reasoning
          - "off"
          - --reasoning-budget
          - "0"
          - --reasoning-format
          - none
    default_params:
      temperature: 0.1
      max_tokens: 512
      timeout_seconds: 300

pipeline_routing: {}