providers:
  - id: gemma_e2b_q4_local
    provider_type: openai_compatible
    model_name: gemma_e2b_q4_local
    capabilities:
      input_modalities:
        - text
        - image
    connection:
      base_url: http://127.0.0.1:18012
      managed_server:
        binary_path: /opt/llama-cpp/llama-server
        model_path: /models/google_gemma-4-E2B-it-Q4_K_M.gguf
        host: 127.0.0.1
        port: 18012
        startup_timeout_seconds: 180
        threads: 8
        mmproj_path_env: GEMMA_E2B_Q4_LOCAL_MMPROJ_PATH
        extra_args:
#          - --reasoning
#          - "off"
#          - --reasoning-budget
#          - "0"
#          - --reasoning-format
#          - none
    default_params:
      timeout_seconds: 300

