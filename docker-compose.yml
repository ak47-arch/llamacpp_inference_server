version: "3.8"

services:
  llm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-inference-server
    restart: unless-stopped
    environment:
      LLM_SERVER_HOST: 0.0.0.0
      LLM_SERVER_PORT: 8012
      LLM_SERVER_CONFIG_FILE: /app/llm/service_models.yaml
      GEMMA_E2B_LOCAL_MMPROJ_PATH: /models/mmproj-google_gemma-4-E2B-it-f16.gguf
      GEMMA_E4B_LOCAL_MMPROJ_PATH: /models/mmproj-google_gemma-4-E4B-it-f16.gguf
      GEMMA_E4B_Q4_LOCAL_MMPROJ_PATH: /models/mmproj-google_gemma-4-E4B-it-f16.gguf
    ports:
      - "8012:8012"
    volumes:
      - ./gemma:/models:ro
      - ${LLAMA_CPP_DIR:?set LLAMA_CPP_DIR}:/opt/llama-cpp:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/ready', timeout=30)"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 60s

networks:
  default:
    name: llm-network
    driver: bridge
