version: "3.8"

services:
  llm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-inference-server
    restart: unless-stopped
    environment:
      LLM_SERVER_HOST: 0.0.0.0
      LLM_SERVER_PORT: 8012
      LLM_SERVER_CONFIG_FILE: /app/llm/service_models.yaml
      GEMMA_E2B_Q4_LOCAL_MMPROJ_PATH: /models/mmproj-google_gemma-4-E2B-it-f16.gguf
#      GEMMA_E4B_Q4_LOCAL_MMPROJ_PATH: /models/mmproj-google_gemma-4-E4B-it-f16.gguf
      LLM_CAPTURE_ENABLED: "true"
      LLM_CAPTURE_MODE: "full"
      LLM_CAPTURE_SINK: "ndjson"
      LLM_CAPTURE_FILE_PATH: "/tmp/capture.ndjson"
      LLM_CAPTURE_INCLUDE_SYSTEM_PROMPTS: "true"
    ports:
      - "8012:8012"
    volumes:
      - ./gemma:/models:ro
      - ${LLAMA_CPP_DIR:?set LLAMA_CPP_DIR}:/opt/llama-cpp:ro
      - ./tmp:/tmp:rw
      - ./service_models.yaml:/app/llm/service_models.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/health', timeout=30)"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 60s

networks:
  default:
    name: workspace-shared-llm-network
    external: true
